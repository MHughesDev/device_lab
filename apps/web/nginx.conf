server {
  listen 80;

  # Use Docker's embedded DNS resolver so nginx defers upstream hostname
  # resolution to request time instead of failing at startup when the
  # backend container hasn't started yet.
  resolver 127.0.0.11 valid=10s;

  # Proxy all /api/ and /mcp/ traffic to the backend container.
  # Without this, relative-URL fetch() calls would get index.html back.
  # The $backend variable forces runtime DNS resolution (required with
  # the resolver directive above).
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass         $backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # keep-alive passthrough (needed for SSE / streaming endpoints)
    proxy_set_header   Connection        "";
  }

  location /mcp/ {
    set $backend http://backend:8000;
    proxy_pass         $backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
